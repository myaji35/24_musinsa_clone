# 배송·반품 규정(대표님 확정 2026-10-22). 전자상거래법 기준 — 약관 확정 전 표준약관 대조·전문가 검토 권장.
shipping: 전 상품 무료배송
return_fee: 6000
summary:
  - title: 반품 신청 기간
    body: 상품 수령 후 7일 이내에 신청해 주세요.
  - title: 단순 변심 반품
    body: 왕복 배송비 6,000원은 고객 부담이며 환불 금액에서 차감됩니다. 무료배송으로 받으신 첫 배송비가 포함된 금액입니다.
  - title: 사이즈 교환
    body: 1회 가능하며 왕복 배송비 6,000원은 고객 부담입니다.
  - title: 불량·오배송·설명과 다른 상품
    body: 배송비는 JIEUM이 부담합니다. 수령 후 3개월 이내, 또는 문제를 안 날부터 30일 이내에 신청해 주세요.
not_accepted:
  - 택(태그)을 제거하거나 훼손한 경우
  - 착용 흔적이 있는 경우(향수·화장품·체취·반려동물 털·오염·세탁)
  - 구성품(벨트 등)이 빠진 경우
  - 고객 부주의로 상품이 훼손된 경우
process:
  - 고객센터로 반품을 먼저 접수해 주세요. 택이 달린 상태의 사진을 함께 첨부해 주세요.
  - 지정 택배로만 회수합니다. 접수 없이 임의로 보내시면 처리가 늦어질 수 있습니다.
  - 상품이 도착하면 검수한 뒤 환불합니다. 검수 결과 반품 불가 사유에 해당하면 상품을 다시 보내 드리며, 이때 배송비는 고객 부담입니다.
  - 단순 변심 반품이 3개월 안에 3회 이상이면 이용약관에 따라 주문이 제한될 수 있습니다.
