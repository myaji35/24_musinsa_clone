hero:
  headline: 큰 칼라로 감싸고, 벨트 하나로 정리하는 하프 랩코트
  sub: 단추 없이 여미고 묶는 코트입니다. 니트 위에 걸치고 벨트만 묶으면 외출 준비가 끝납니다.

scenes:
  - shot: look1
    title: 출근길·장보는 길
    copy: 엉덩이를 살짝 덮는 길이라 걸음이 편합니다. 칼라를 세우면 목선까지 포근하게 감싸요.
  - shot: look2
    title: 카페·친구 모임
    copy: 실내에서는 벨트를 느슨하게 묶어 편하게. 큰 칼라가 얼굴 주변을 밝고 부드럽게 정리해 줍니다.
  - shot: look3
    title: 주말 나들이
    copy: 아이보리 바지와 브라운 로퍼면 충분합니다. 카멜이 가장 쉽게 어울리는 조합이에요.

