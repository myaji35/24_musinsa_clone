hero:
  eyebrow: 2026 WINTER · WRAP COAT
  headline: 니트 위에 툭, 벨트만 묶으면 외출 준비 끝
  sub: 단추를 잠글 필요가 없는 하프 랩코트. 큰 칼라가 목까지 감싸고, 벨트 하나로 실루엣이 정리됩니다.

worries:
  title: 이런 고민, 있으셨죠?
  items:
    - 롱코트는 부담스럽고, 숏패딩은 너무 캐주얼해요
    - 단추 코트는 매번 잠그고 푸는 게 번거로워요
    - 목이 허전해서 머플러를 꼭 챙겨야 해요
  answer: 그래서 이 코트는 — 묶고, 감싸고, 덮습니다.

points:
  - image: detail1
    title: 세우면 목까지, 내리면 케이프처럼
    copy: 어깨를 덮는 큰 숄칼라. 바람 부는 날엔 세워서 머플러 대신, 실내에선 내려서 부드러운 케이프 라인으로.
  - image: detail2
    title: 벨트 하나로 두 가지 실루엣
    copy: 같은 원단의 허리 벨트. 꽉 묶으면 허리 라인이 살고, 느슨하게 두면 여유 있는 핏이 됩니다.
  - image: detail3
    title: 니트를 겹쳐도 편안한 어깨
    copy: 어깨선이 자연스럽게 내려간 드롭 숄더. 두꺼운 니트 위에 입어도 팔이 끼지 않아요. 길이는 엉덩이를 살짝 덮는 하프 기장.

scenes:
  - shot: look1
    day: MON
    title: 출근길
    copy: 아이보리 슬랙스에 로퍼. 단정한데 차갑지 않게, 벨트는 단단히 묶어서.
  - shot: look2
    day: SAT
    title: 카페·친구 모임
    copy: 벨트는 느슨하게, 니트 소매를 살짝 접어서. 앉아 있어도 편한 하프 기장.
  - shot: look3
    day: SUN
    title: 주말 나들이
    copy: 브라운 토트를 들면 카멜과 톤온톤 완성. 가장 쉽게 어울리는 조합이에요.

