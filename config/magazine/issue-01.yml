issue: 1
title: "추위는 지우고, 스타일은 잇다"
subtitle: "2027 겨울, 가장 먼저 입어보세요. 아우터와 원피스 30가지를 네 편의 이야기로 담았습니다."
status: draft
cover: { product: G29, shot: look2 }
articles:
  - slug: waist-first-silhouette
    kicker: "COVER STORY"
    title: "허리에서 시작되는 실루엣"
    lede: "올겨울 JIEUM이 가장 먼저 꺼내 놓은 것은 벨트입니다. 단추 대신 허리를 한 번 감싸는 것만으로, 코트의 인상이 달라집니다."
    hero: { product: G01, shot: look1 }
    virtual_note: true
    blocks:
      - type: text
        body: "두툼한 아우터를 입는 계절일수록 몸의 선은 쉽게 사라집니다. 올겨울 JIEUM은 그 선을 되찾는 방법으로 허리를 택했습니다. 랩코트의 벨트, 패딩의 벨트, 케이프의 가죽 스트랩. 모두 허리에서 시작해 어깨와 밑단으로 실루엣을 흘려보내는 디자인입니다."
      - type: image
        product: G01
        shot: look1
        caption: "숄칼라 벨티드 울 랩코트, 카멜. 은행잎이 내려앉은 가로수길에서 벨트를 앞으로 느슨하게 묶었습니다."
      - type: text
        body: "숄칼라 랩코트는 여밈이 자유롭습니다. 칼라를 세우면 얼굴이 작아 보이고, 눕히면 목선이 길어 보입니다. 벨트를 단단히 매면 단정한 출근길이, 살짝 풀어 두면 느긋한 주말 오후가 됩니다. 한 벌로 두 가지 표정을 내는 코트입니다."
      - type: image
        product: G08
        shot: look2
        caption: "배색 숄칼라 랩 롱코트, 카키. 저녁 호텔 라운지 입구의 따뜻한 조명 아래, 칼라의 배색이 선명하게 드러납니다."
      - type: tip
        title: "벨트, 세 가지로 묶기"
        items:
          - "앞 매듭: 허리 바로 위에서 한 번만 묶습니다. 매듭은 작게, 끝은 길게 늘어뜨리면 세로선이 살아납니다."
          - "뒤로 넘기기: 벨트를 뒤에서 묶으면 앞면이 깔끔해집니다. 안에 원피스나 니트의 색을 보여주고 싶을 때 좋습니다."
          - "걸쳐 두기: 묶지 않고 양 끝을 늘어뜨려 두면 코트 자체의 둥근 실루엣이 그대로 드러납니다."
      - type: text
        body: "벨트는 울코트에만 있는 것이 아닙니다. 벨티드 스탠드칼라 롱패딩은 볼륨 있는 패딩의 허리를 한 번 조여 긴 선을 만들고, 카멜 컬러의 벨티드 후드 롱패딩은 같은 방법으로 좀 더 부드러운 인상을 냅니다. 숏패딩이라면 다크브라운의 벨티드 후드 숏패딩이 허리 위치를 또렷하게 잡아 줍니다."
      - type: products
        ids: [G01, G08, G03, G29, G30, G26]
      - type: character
        handle: KangUNA
        body: "저는 벨트를 꽉 묶지 않아요. 한 번만 가볍게 매고 끝을 흘려 두면, 걸을 때 코트가 같이 움직여서 훨씬 편하거든요."

  - slug: energy-on-snow
    kicker: "MOVEMENT"
    title: "눈 위에서 움직이는 겨울"
    lede: "건강한 겨울은 빛과 움직임에서 나옵니다. 파란 하늘 아래 눈 덮인 마을, 저녁의 옥상 코트, 도시 불빛 속 아이스링크. 패딩이 가장 잘 어울리는 장면들입니다."
    hero: { product: G14, shot: look1 }
    virtual_note: true
    blocks:
      - type: text
        body: "패딩은 추위를 막는 옷이면서 동시에 가장 활동적인 옷입니다. 이번 시즌 JIEUM의 패딩은 눈이 쌓인 스키 리조트 마을과 숲길, 그리고 도시의 밤에서 촬영했습니다. 빛이 닿는 곳에서 색이 살고, 걷고 뛰는 순간에 실루엣이 드러납니다."
      - type: image
        product: G14
        shot: look1
        caption: "퍼넬넥 오버핏 롱패딩, 베이지. 맑은 날 눈 덮인 리조트 마을 길에서. 목을 감싸는 퍼넬넥이 머플러 없이도 얼굴을 또렷하게 만듭니다."
      - type: text
        body: "긴 패딩은 걸음의 폭에 따라 밑단이 흔들리며 선을 만듭니다. 셰브론 퀼팅 롱패딩의 사선 퀼팅은 움직일 때마다 각도가 달라져, 어두운 카키 색에도 표정이 생깁니다. 반대로 숏패딩은 다리 길이를 그대로 보여 주기 때문에, 계단을 오르거나 공을 쫓는 장면에서 가장 가볍습니다."
      - type: image
        product: G23
        shot: look3
        caption: "스트랩 후드 숏패딩, 블랙/아이보리. 해 질 녘 옥상 농구 코트, 도시의 불빛이 켜지기 시작하는 시간."
      - type: tip
        title: "패딩, 장면에 맞춰 고르기"
        items:
          - "오래 걷는 날: 롱패딩. 긴 기장이 다리의 선을 덮어 주므로, 안에는 얇은 니트 한 장으로 가볍게 입습니다."
          - "많이 움직이는 날: 숏패딩. 허리 위에서 끝나는 기장이 팔과 다리의 움직임을 막지 않습니다. 하의는 밝은 색으로 균형을 맞춥니다."
          - "밤 외출: 어두운 색 패딩에 아이보리나 버건디 같은 색 하나를 더합니다. 후드 안감이나 머플러 한 가지면 됩니다."
      - type: image
        product: G17
        shot: look3
        caption: "후드 롱패딩, 블랙. 언덕 마을의 눈 쌓인 돌계단을 오르는 순간, 검은 패딩이 눈 위에서 가장 선명한 선이 됩니다."
      - type: products
        ids: [G14, G17, G18, G23, G25, G15]
      - type: character
        handle: ChenMAYA
        body: "달리기 전 몸을 풀 때는 숏패딩, 끝나고 걸어서 돌아올 때는 롱패딩이에요. 둘 다 후드가 있어서 머리가 식지 않아요."

  - slug: one-coat-three-scenes
    kicker: "ONE COAT"
    title: "한 벌의 코트, 세 개의 장면"
    lede: "부클 트위드 더블 롱코트 한 벌을 아침 카페 거리, 저녁 재즈 바 골목, 낙엽 날리는 광장으로 데려갔습니다. 옷은 같고, 하루는 달라집니다."
    hero: { product: G02, shot: look1 }
    virtual_note: true
    blocks:
      - type: text
        body: "좋은 코트의 기준은 단순합니다. 하루의 어느 시간에 입어도 어색하지 않을 것. 브라운베이지 부클 트위드 더블 롱코트는 그 기준을 확인해 보기에 알맞은 옷이었습니다. 더블 여밈과 긴 기장, 그리고 빛에 따라 결이 달라지는 트위드 표면이 장면마다 다른 얼굴을 보여 줍니다."
      - type: image
        product: G02
        shot: look1
        caption: "아침. 햇살이 드는 오래된 벽돌 거리의 카페 테라스. 단추를 모두 채우고 칼라를 눕혀 트위드의 결을 보여 줍니다."
      - type: text
        body: "낮에는 단정하게, 저녁에는 조금 풀어 둡니다. 재즈 바 골목의 노란 가로등 아래에서는 윗단추를 열고 안에 입은 어두운 색 옷을 드러내는 것만으로 분위기가 바뀝니다. 트위드의 브라운 톤이 빈티지한 조명과 같은 온도를 갖기 때문에, 액세서리를 더하지 않아도 충분합니다."
      - type: image
        product: G02
        shot: look2
        caption: "저녁. 따뜻한 빈티지 램프가 켜진 재즈 바 거리. 윗단추를 풀고, 선은 허리에서 밑단으로 흐르게 두었습니다."
      - type: image
        product: G02
        shot: look3
        caption: "바람. 낙엽이 날리는 돌바닥 광장. 긴 기장이 걸음을 따라 열리며 코트의 안쪽까지 보입니다."
      - type: tip
        title: "하루 종일 입는 롱코트의 요령"
        items:
          - "아침에는 단추를 모두 채워 세로선을 만들고, 저녁에는 위에서 한두 개만 풀어 목선을 보여 줍니다."
          - "안에는 코트와 같은 톤의 니트나 셔츠를 고릅니다. 색이 섞이지 않을수록 코트의 결이 잘 보입니다."
          - "바람이 부는 날에는 앞을 열어 두어도 괜찮습니다. 긴 기장이 움직이면 그 자체가 스타일이 됩니다."
      - type: products
        ids: [G02, G07, G09, G13]
      - type: character
        handle: HanSOYUL
        body: "회의가 많은 날은 단추를 다 채우고, 퇴근 후 약속이 있으면 두 개만 풀어요. 코트를 바꾸지 않아도 충분히 다른 사람처럼 보여요."

  - slug: fit-guide-by-height
    kicker: "FIT GUIDE"
    title: "키와 체형으로 읽는 겨울 핏"
    lede: "이번 시즌 룩북에 등장한 열 명의 캐릭터는 158cm부터 171cm까지, 키와 체형이 모두 다릅니다. 사진 속 기장과 실루엣을 비교해 내게 맞는 핏을 찾는 안내서입니다."
    hero: { product: G16, shot: look1 }
    virtual_note: true
    blocks:
      - type: text
        body: "같은 롱패딩도 입는 사람의 키에 따라 밑단이 닿는 위치가 달라집니다. 룩북의 캐릭터들은 타나카 미오 158cm, 윤채이 160cm, 오다은 161cm, 마야 첸 162cm, 강유나 163cm, 서하린 164cm, 한소율 165cm, 제이드 박 166cm, 에린 소 168cm, 레아 모로 171cm입니다. 내 키와 가까운 캐릭터의 사진을 기준으로 삼으면 기장을 가늠하기 쉽습니다."
      - type: image
        product: G16
        shot: look1
        caption: "오버핏 후드 패딩, 그레이지. 158cm 아담한 체형의 타나카 미오. 넉넉한 품이 어깨를 둥글게 감싸고, 짧은 기장이 다리를 길어 보이게 합니다."
      - type: text
        body: "키가 작은 편이라면 오버핏이라도 기장이 짧은 쪽을 고르는 것이 균형을 잡기 쉽습니다. 반대로 171cm 긴 팔다리의 레아 모로가 입은 벨티드 스탠드칼라 롱패딩은 긴 기장이 그대로 세로선이 되어, 벨트로 허리를 한 번 잡아 주는 것만으로 비율이 정리됩니다. 160cm 안팎이라면 벨트가 있는 롱패딩처럼 허리 위치를 잡아 주는 디자인이 가장 무난합니다."
      - type: image
        product: G29
        shot: look1
        caption: "벨티드 스탠드칼라 롱패딩, 블랙. 171cm의 레아 모로. 눈 덮인 숲길에서 긴 기장과 벨트가 하나의 선으로 이어집니다."
      - type: text
        body: "부드러운 곡선형 체형이라면 허리를 숨기기보다 보여 주는 편이 오히려 날렵해 보입니다. 161cm 오다은이 입은 드로스트링 후드 롱패딩은 끈을 조이는 정도에 따라 볼륨이 달라지고, 차콜 버튼 민소매 롱 원피스는 세로로 이어지는 단추 선이 몸을 길게 보이게 합니다. 160cm 가녀린 체형의 윤채이가 입은 U넥 울 점퍼 원피스는 안에 얇은 터틀넥이나 블라우스를 더해 목선을 채우면 겨울에도 가볍게 입을 수 있습니다."
      - type: tip
        title: "주문 전 확인할 것"
        items:
          - "안에 무엇을 입을지 먼저 정합니다. 두꺼운 니트 위에 입을 코트라면 품과 소매가 여유 있는 쪽이 편합니다."
          - "상품 페이지의 사이즈 정보를 확인하고, 내 키와 가까운 캐릭터의 룩북 사진에서 밑단과 소매 끝의 위치를 비교해 보세요."
          - "배송은 전 상품 무료입니다. 단순 변심 반품은 수령 후 7일 이내에 신청해야 하며, 왕복 배송비 6,000원은 고객 부담입니다."
      - type: products
        ids: [G16, G29, G20, G10, G11, G22]
      - type: character
        handle: SeoHARIN
        body: "164cm에 어깨가 좁은 편이라 숄칼라 롱패딩은 소매 끝이 손등에 닿는지부터 봐요. 기장이 길어도 소매가 맞으면 단정해 보이거든요."
