name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint (RuboCop)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true

    - name: Run RuboCop
      run: bundle exec rubocop --parallel

  security:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true

    - name: Run Brakeman
      run: bundle exec brakeman --no-pager

    - name: Run bundler-audit
      run: bundle exec bundler-audit --update

  test:
    name: Test Suite
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true

    - name: Install dependencies
      run: |
        bundle install --jobs 4 --retry 3

    - name: Set up database
      run: |
        bin/rails db:create RAILS_ENV=test
        bin/rails db:schema:load RAILS_ENV=test

    # 디렉터리 지정 실행은 test:prepare를 거치지 않으므로 CSS를 별도로 준비
    - name: Build test assets
      run: bin/rails tailwindcss:build RAILS_ENV=test

    - name: Run tests
      run: bin/rails test test/models test/services test/controllers test/helpers

    - name: Upload coverage reports
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/

  build-assets:
    name: Build Assets
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true

    - name: Install dependencies
      run: |
        bundle install --jobs 4 --retry 3

    - name: Build Tailwind CSS
      run: bin/rails tailwindcss:build

    - name: Precompile assets
      env:
        SECRET_KEY_BASE: dummy_secret_key_base_for_ci_build
      run: bin/rails assets:precompile RAILS_ENV=production

  deploy:
    name: Deploy to Production
    needs: [lint, security, test, build-assets]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true

    - name: Install Kamal
      run: gem install kamal

    # Kamal 배포는 secrets 설정 필요
    # - name: Deploy with Kamal
    #   env:
    #     KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
    #   run: kamal deploy

    - name: Deployment placeholder
      run: |
        echo "✅ All checks passed! Ready for deployment."
        echo "To enable Kamal deployment, configure KAMAL_REGISTRY_PASSWORD in GitHub Secrets"
